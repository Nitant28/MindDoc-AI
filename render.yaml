services:
  - type: web
    name: minddoc-ai
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      # Random secret generated by Render on first deploy, so tokens can't be forged with a default.
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER_ORDER
        value: openrouter,anthropic,openai,gemini,deepseek
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-120b:free
      # The UI is served by the API (same origin), so CORS only needs the service's own URL.
      - key: CORS_ORIGINS
        sync: false
    # On `plan: free`, /data (SQLite DB + uploaded originals) resets on every deploy.
    # To keep data, switch to a paid plan (Render attaches disks only to paid instance types) and uncomment:
    # disk:
    #   name: minddoc-data
    #   mountPath: /data
    #   sizeGB: 1
