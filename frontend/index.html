<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#f8fafd" />
    <meta
      name="description"
      content="MindDoc AI: glass-box document intelligence with cited answers, confidence, groundedness checks and reasoning traces."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b57d0'/%3E%3Cpath d='M10.5 21.5 16 11.5l5.5 8.5' fill='none' stroke='white' stroke-opacity='.6' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='10.5' cy='21.5' r='2.5' fill='white'/%3E%3Ccircle cx='16' cy='11.5' r='2.5' fill='white'/%3E%3Ccircle cx='21.5' cy='20' r='2.5' fill='white'/%3E%3C/svg%3E"
    />
    <title>MindDoc AI</title>
    <script>
      (function () {
        var root = document.documentElement;
        var stored = null;
        try {
          stored = window.localStorage.getItem('theme');
        } catch (e) {
          /* storage unavailable */
        }
        var dark = stored ? stored === 'dark' : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
