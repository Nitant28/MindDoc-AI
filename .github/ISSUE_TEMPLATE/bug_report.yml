name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include real customer documents, account numbers or credentials. Use synthetic data.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. Upload ...\n2. Open ...\n3. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The value of /api/health, or the git commit.
  - type: dropdown
    id: db
    attributes:
      label: Database
      options: [PostgreSQL, SQLite, Not sure]
